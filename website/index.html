<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Instinct 13 — observation before interpretation.">
<title>Instinct 13</title>
<style>
:root{--bg:#080808;--fg:#f4f4f0;--muted:#8d8d88;--line:rgba(244,244,240,.2);--red:#d61f26;--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
a,button{font:inherit}
.experience{position:relative;min-height:100svh;isolation:isolate}
.manifestation{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.symbol{width:min(66vw,560px);height:min(66vw,560px);overflow:visible}
.ring{fill:none;stroke:var(--fg);stroke-width:1;opacity:0;transform-origin:50% 50%;transform:scale(.9);transition:opacity 1800ms var(--ease),transform 2400ms var(--ease)}
.segment{fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round;opacity:0;transform-origin:50% 50%;transition:opacity 1100ms var(--ease),transform 1400ms var(--ease)}
.left{transform:translateX(-18px) scaleY(.84)}.right{transform:translateX(18px) scaleY(.84)}
.center{fill:var(--fg);opacity:0;transform:scale(.2);transform-origin:50% 50%;transition:opacity 900ms var(--ease),transform 1100ms var(--ease)}
.manifestation[data-stage="1"] .segment{opacity:.28}.manifestation[data-stage="1"] .left{transform:translateX(-8px) scaleY(.9)}.manifestation[data-stage="1"] .right{transform:translateX(8px) scaleY(.9)}
.manifestation[data-stage="2"] .segment{opacity:.55}.manifestation[data-stage="2"] .left,.manifestation[data-stage="2"] .right{transform:translateX(0) scaleY(1)}
.manifestation[data-stage="3"] .segment{opacity:.9}.manifestation[data-stage="3"] .left{transform:translateX(-4px) scaleY(1)}.manifestation[data-stage="3"] .right{transform:translateX(4px) scaleY(1)}
.manifestation[data-stage="4"] .ring{opacity:.45;transform:scale(1)}.manifestation[data-stage="4"] .segment{opacity:1}.manifestation[data-stage="4"] .center{opacity:1;transform:scale(1)}
.manifestation[data-stage="5"] .ring{opacity:.72}.manifestation[data-stage="5"] .segment{opacity:1}.manifestation[data-stage="5"] .center{opacity:1;transform:scale(1.25)}
.manifestation[data-stage="5"] .center{fill:var(--red)}
.mark{position:fixed;top:26px;left:26px;z-index:5;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;opacity:0;transform:scale(.8);transition:opacity 1000ms var(--ease),transform 1200ms var(--ease),border-color 700ms ease,color 700ms ease}.mark::before{content:"13";font-size:10px;letter-spacing:.08em}.mark.visible{opacity:.9;transform:scale(1)}.mark.event{border-color:var(--red);color:var(--red)}
.state{position:absolute;inset:0;display:grid;place-items:center;padding:9vw;text-align:center;opacity:0;visibility:hidden;transition:opacity 1200ms var(--ease),visibility 0s linear 1200ms}.state.active{opacity:1;visibility:visible;transition:opacity 1200ms var(--ease),visibility 0s}
.copy{max-width:980px}.statement{margin:0;font-size:clamp(2.5rem,6.8vw,7rem);line-height:.96;letter-spacing:-.055em;font-weight:450}.quiet{font-size:clamp(1.9rem,4.5vw,4.8rem);line-height:1.02;letter-spacing:-.045em}.question{margin:0;font-size:clamp(2.2rem,5.5vw,5.8rem);line-height:1;letter-spacing:-.05em;font-weight:420}.eyebrow{margin:0 0 28px;color:var(--muted);font-size:10px;letter-spacing:.22em;text-transform:uppercase}.passage{margin-top:44px;padding:12px 0 10px;border:0;border-bottom:1px solid rgba(244,244,240,.38);background:transparent;color:var(--fg);cursor:pointer;font-size:11px;letter-spacing:.2em;text-transform:uppercase}.passage:hover,.passage:focus-visible{border-color:var(--red);color:var(--red);outline:none}
.nav-shell{position:fixed;top:26px;right:26px;z-index:6;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity 900ms var(--ease),transform 900ms var(--ease)}.nav-shell.visible{opacity:1;transform:none;pointer-events:auto}nav{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:18px;max-width:min(72vw,620px)}nav a{color:var(--muted);text-decoration:none;font-size:9px;letter-spacing:.16em;text-transform:uppercase}nav a:hover,nav a:focus-visible{color:var(--fg);outline:none}
.discovery{position:fixed;bottom:30px;left:50%;z-index:5;transform:translate(-50%,8px);color:rgba(244,244,240,.4);font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:0;transition:opacity 900ms var(--ease),transform 900ms var(--ease)}.discovery.visible{opacity:1;transform:translate(-50%,0)}.event-dot{display:inline-block;width:5px;height:5px;margin-right:8px;border-radius:50%;background:var(--red);vertical-align:middle;opacity:0;transition:opacity 700ms ease}.event-dot.visible{opacity:1}
@media(max-width:700px){.symbol{width:82vw;height:82vw}.mark{top:18px;left:18px}.nav-shell{top:72px;left:18px;right:18px}nav{justify-content:flex-start;gap:12px 16px}.state{padding:28vw 8vw}.discovery{bottom:20px;white-space:nowrap}}
@media(prefers-reduced-motion:reduce){.ring,.segment,.center,.mark,.state,.nav-shell,.discovery{transition-duration:1ms!important}}
</style>
</head>
<body>
<main class="experience">
  <div class="manifestation" id="manifestation" aria-hidden="true">
    <svg class="symbol" viewBox="0 0 500 500" role="presentation">
      <circle class="ring" cx="250" cy="250" r="184"/>
      <g class="segments">
        <path class="segment left" d="M174 112 L174 178 M174 196 L174 262 M174 280 L174 346"/>
        <path class="segment left" d="M206 112 L206 178 M206 196 L206 262 M206 280 L206 346"/>
        <path class="segment right" d="M326 112 L326 178 M326 196 L326 262 M326 280 L326 346"/>
        <path class="segment right" d="M294 112 L294 178 M294 196 L294 262 M294 280 L294 346"/>
      </g>
      <circle class="center" cx="250" cy="250" r="3.5"/>
    </svg>
  </div>

  <div class="mark" id="mark" aria-label="Instinct 13"></div>

  <div class="nav-shell" id="navShell">
    <nav aria-label="Primary">
      <a href="#home">Home</a><a href="#philosophy">Philosophy</a><a href="#manifesto">Manifesto</a><a href="#circle">The Circle</a><a href="#mirror">The Mirror</a><a href="#contact">Contact</a>
    </nav>
  </div>

  <section class="state" data-state="0" aria-label="Disruption" aria-hidden="true"><div class="copy"><p class="statement">YOU ARE NOT A TYPE.</p></div></section>
  <section class="state" data-state="1" aria-label="Observation" aria-hidden="true"><div class="copy"><p class="question">WHAT IS MANIFESTING NOW?</p></div></section>
  <section class="state" data-state="2" aria-label="Humility" aria-hidden="true"><div class="copy"><p class="statement quiet">REALITY IS ALWAYS GREATER<br>THAN THE FRAMEWORK USED TO OBSERVE IT.</p></div></section>
  <section class="state" data-state="3" aria-label="Participation" aria-hidden="true"><div class="copy"><p class="eyebrow"><span class="event-dot" id="eventDot"></span>Instinct 13</p><button class="passage" id="beginObservation" type="button">Begin observation</button></div></section>
  <div class="discovery" id="discovery">Observation before interpretation.</div>
</main>
<script>
(()=>{
 const manifestation=document.getElementById('manifestation'),states=[...document.querySelectorAll('.state')],mark=document.getElementById('mark'),nav=document.getElementById('navShell'),begin=document.getElementById('beginObservation'),dot=document.getElementById('eventDot'),discovery=document.getElementById('discovery');
 let stage=0,state=-1,timer;
 const setStage=n=>{stage=n;manifestation.dataset.stage=String(n)};
 const setState=n=>{state=n;states.forEach((el,i)=>{const active=i===n;el.classList.toggle('active',active);el.setAttribute('aria-hidden',String(!active))})};
 const next=()=>{if(stage<5){setStage(stage+1);if(stage===5)setTimeout(()=>setState(0),1200)}};
 setStage(0);
 const schedule=ms=>{clearTimeout(timer);timer=setTimeout(next,ms)};
 schedule(1200);
 manifestation.addEventListener('transitionend',()=>{});
 const run=()=>{
   if(stage<5){next();schedule(stage===1?900:stage===2?1100:stage===3?1500:stage===4?1800:0)}
 };
 setTimeout(run,1500);setTimeout(run,2700);setTimeout(run,4100);setTimeout(run,5900);setTimeout(run,8100);
 setTimeout(()=>setState(0),9400);
 begin.addEventListener('click',()=>{nav.classList.add('visible');discovery.classList.add('visible');mark.classList.add('visible','event');dot.classList.add('visible')});
 document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&state===-1){e.preventDefault();setState(0)}});
 setTimeout(()=>{mark.classList.add('visible')},9000);
})();
</script>
</body>
</html>
