name: Regenerate security upgrade lockfile

on:
  push:
    branches: ["security/nextjs-15-5-28"]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/nextjs-15-5-28
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: instinct13-web/package-lock.json
      - name: Regenerate lockfile from pinned patched dependencies
        working-directory: instinct13-web
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- instinct13-web/package-lock.json; then
            echo "Lockfile already matches package.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instinct13-web/package-lock.json
          git commit -m "Update lockfile for patched Next.js"
          git push origin HEAD:security/nextjs-15-5-28
